name: test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The panel lives in a tmux popup and hands files to nvim, so the tests
      # that cover those drive the real things. They skip themselves when the
      # tools are absent, which would quietly cover half the suite in nothing.
      - name: install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      # From the project's own release rather than apt: the palette is read
      # from the editor over its socket, and a neovim old enough not to report
      # GUI colours would make those tests skip themselves — which is the same
      # as not having them.
      #
      # Pinned to a version and a digest, not to "stable": this downloads a
      # binary and then runs it, so what it runs should not be able to change
      # underneath the build. Neovim publishes no checksum of its own, so the
      # digest here was taken from this exact asset. If it ever stops matching,
      # the build stops rather than running something else.
      - name: install neovim
        env:
          NVIM_VERSION: v0.12.5
          NVIM_SHA256: bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875
        run: |
          curl -fsSL -o /tmp/nvim.tar.gz \
            "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/nvim-linux-x86_64.tar.gz"
          echo "${NVIM_SHA256}  /tmp/nvim.tar.gz" | sha256sum -c -
          sudo tar -C /opt -xzf /tmp/nvim.tar.gz
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: versions
        run: |
          tmux -V
          nvim --version | head -1

      - name: gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '^$' || true)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      # A skipped test proves nothing, so say how many skipped and why.
      - name: report skips
        if: always()
        run: go test ./... -v 2>&1 | grep -c -- '--- SKIP' || true
